<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ask questions about your own study PDFs and find the source page.">
    <title>{% block title %}Docs AI{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #202c35;
            background: #f5f5f1;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f5f5f1; }
        a { color: #285b4b; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 1180px; margin: auto; padding: 18px 26px;
            border-bottom: 1px solid #e2e5df;
        }
        .brand { color: #202c35; font-size: 1.2rem; font-weight: 750; letter-spacing: -.04em; text-decoration: none; }
        .brand span { color: #39745e; }
        .nav { display: flex; align-items: center; gap: 18px; }
        .nav a, .nav button { color: #315f50; font: inherit; text-decoration: none; }
        .nav a:hover, .nav button:hover { color: #1e4438; text-decoration: underline; }
        .nav button { border: 0; padding: 0; background: none; cursor: pointer; }
        .nav form { margin: 0; }
        main { max-width: 980px; margin: 58px auto; padding: 24px; }
        .eyebrow { color: #39745e; font-size: .76rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
        h1 { max-width: 760px; margin: 14px 0; font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: 1.04; letter-spacing: -.055em; overflow-wrap: anywhere; }
        .intro { max-width: 650px; color: #5c6870; font-size: 1.15rem; line-height: 1.7; }
        .panel, .form-card {
            margin-top: 26px; padding: 26px; border: 1px solid #e1e5df;
            border-radius: 14px; background: #fff; box-shadow: 0 8px 28px #25372b0a;
        }
        .panel h2 { margin: 0 0 10px; font-size: 1.15rem; }
        .panel p, .muted { color: #59666d; line-height: 1.65; }
        .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px; }
        .step { padding: 16px; border-radius: 12px; background: #eeeee8; }
        .number { color: #39745e; font-weight: 750; font-size: .82rem; }
        .step h3 { margin: 8px 0 5px; font-size: 1rem; }
        .step p { margin: 0; font-size: .9rem; }
        .form-card { max-width: 520px; margin: 34px auto; }
        .form-card h1 { font-size: 2.3rem; }
        .field { margin: 18px 0; }
        .field label, .question-field label { display: block; margin-bottom: 8px; font-weight: 650; }
        .field input, .field textarea, .field select {
            width: 100%; padding: 12px 13px; border: 1px solid #cbd2cc;
            border-radius: 8px; font: inherit; background: #fff;
        }
        .help { margin: 6px 0 0; color: #687488; font-size: .83rem; line-height: 1.5; }
        .errorlist { color: #ad2d3c; padding-left: 20px; font-size: .9rem; }
        .button {
            display: inline-block; border: 0; border-radius: 8px; padding: 12px 17px;
            color: white !important; background: #315f50; font: inherit;
            font-weight: 650; text-decoration: none; cursor: pointer;
            transition: background .15s ease;
        }
        .button:hover { background: #24493d; }
        .button:focus-visible, a:focus-visible, textarea:focus-visible {
            outline: 3px solid #9abda9; outline-offset: 2px;
        }
        .form-card .button { width: 100%; }
        .footer { max-width: 980px; margin: 0 auto; padding: 0 24px 28px; color: #7a8581; font-size: .82rem; }

        .ask-page { max-width: 920px; margin: 36px auto 64px; }
        .ask-heading { margin-bottom: 22px; }
        .ask-heading .eyebrow { margin: 0 0 10px; }
        .ask-title { max-width: 850px; margin: 0; font-size: clamp(2rem, 4.6vw, 3.25rem); line-height: 1.12; letter-spacing: -.045em; }
        .ask-subtitle { margin: 12px 0 0; color: #64716f; line-height: 1.6; }
        .ask-form { max-width: none; margin: 22px 0 28px; padding: 22px; }
        .question-field label { color: #26342f; }
        .ask-form textarea {
            display: block; width: 100%; min-height: 128px; resize: vertical;
            padding: 14px 15px; border: 1px solid #cbd3cc; border-radius: 9px;
            background: #fcfcfa; color: #202c35; font: inherit; line-height: 1.55;
        }
        .ask-form textarea:focus { border-color: #56816e; outline: 3px solid #dce9df; }
        .ask-form .button { width: auto; min-width: 190px; margin-top: 15px; }
        .notice {
            margin: 18px 0; padding: 14px 18px; border: 1px solid #e6d7b4;
            border-radius: 10px; background: #fffaf0; color: #594a2c;
        }
        .notice p { margin: 0; line-height: 1.55; }
        .answer-card {
            margin-top: 28px; padding: 26px 28px; border: 1px solid #dfe5df;
            border-radius: 14px; background: #fff; box-shadow: 0 8px 28px #25372b0a;
        }
        .answer-heading h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.02em; }
        .answer-kicker { margin: 0 0 5px; color: #64716f; font-size: .75rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
        .answer-text { margin-top: 14px; color: #39464b; line-height: 1.75; overflow-wrap: anywhere; }
        .answer-code {
            max-height: 680px; margin: 18px 0 0; padding: 18px;
            overflow: auto; border: 1px solid #27352f; border-radius: 10px;
            background: #202b27; color: #edf2ee; white-space: pre;
            font: .9rem/1.6 Consolas, "Courier New", monospace;
        }
        .answer-sources { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid #edf0eb; }
        .source-label { color: #64716f; font-size: .85rem; font-weight: 650; }
        .source-list { display: flex; flex-wrap: wrap; gap: 7px; }
        .source-chip { display: inline-block; padding: 5px 10px; border: 1px solid #d6e2d9; border-radius: 999px; background: #f3f7f2; color: #315f50; font-size: .82rem; text-decoration: none; }
        .source-chip:hover { background: #e7efe8; }
        .passages-section { margin-top: 34px; }
        .section-heading { margin-bottom: 14px; }
        .section-heading h2 { margin: 0; font-size: 1.2rem; }
        .section-heading p { margin: 5px 0 0; color: #6b7775; font-size: .9rem; }
        .passage-list { display: grid; gap: 12px; }
        .passage-card { scroll-margin-top: 20px; padding: 20px 22px; border: 1px solid #e1e5df; border-radius: 12px; background: #fff; }
        .passage-card h3 { margin: 0 0 10px; color: #315f50; font-size: .92rem; }
        .passage-card p { margin: 8px 0 0; color: #56636a; line-height: 1.65; overflow-wrap: anywhere; }
        .back-link { margin-top: 26px; }

        @media (max-width: 640px) {
            main { margin-top: 34px; }
            .ask-page { margin-top: 24px; }
            .steps { grid-template-columns: 1fr; }
            .panel, .form-card, .answer-card { padding: 20px; }
            .nav { gap: 10px; font-size: .88rem; }
            .topbar { padding: 15px 18px; }
            .ask-form .button { width: 100%; }
            .answer-code { padding: 14px; font-size: .82rem; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'core:home' %}">Docs<span>AI</span></a>
        <nav class="nav" aria-label="Main navigation">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:dashboard' %}">My dashboard</a>
                <a href="{% url 'documents:list' %}">My PDFs</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Log in</a>
                <a href="{% url 'accounts:signup' %}">Create account</a>
            {% endif %}
        </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="footer">Docs AI · A learning project built step by step with Django</footer>
</body>
</html>
