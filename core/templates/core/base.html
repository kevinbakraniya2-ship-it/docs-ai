<!doctype html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ask questions about your study PDFs and check the source pages behind each answer.">
    <title>{% block title %}Docs AI{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/site.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'core:home' %}" aria-label="Docs AI home">
                <span class="brand-mark" aria-hidden="true">D</span>
                <span>Docs <strong>AI</strong></span>
            </a>
            <nav class="nav" aria-label="Main navigation">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
                    <a href="{% url 'documents:list' %}">My PDFs</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-logout">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">Log in</a>
                    <a class="nav-signup" href="{% url 'accounts:signup' %}">Create account</a>
                {% endif %}
            </nav>
        </div>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer">
        <div class="footer-inner">
            <span>Docs AI</span>
            <span>A quiet place to study from your PDFs.</span>
        </div>
    </footer>
    <script src="{% static 'core/app.js' %}" defer></script>
</body>
</html>
